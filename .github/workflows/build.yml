name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/*arm64-v8a*.apk HarmooPlayer.apk

      # Always-current direct link:
      # https://github.com/<owner>/<repo>/releases/latest/download/HarmooPlayer.apk
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HarmooPlayer.apk \
            --target "$GITHUB_SHA" \
            --title "HarmooPlayer (build #$GITHUB_RUN_NUMBER)" \
            --notes "Built from commit ${GITHUB_SHA::7}. Download HarmooPlayer.apk below and install it." \
            --latest
